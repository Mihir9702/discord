overwrite: true
schema: "../server/schema.graphql"
documents: "src/graphql/**/*.graphql"
generates:
  src/generated/graphql.ts:
    plugins:
      - "typescript"
      - "typescript-operations"
      - "typescript-resolvers"
  ../client/src/graphql.ts:
    plugins:
      - "typescript-operations"
      - "typescript-react-apollo"
