query Messages($channelId: String!, $beforeId: Int) {
  messages(channelId: $channelId, beforeId: $beforeId) {
    hasMore
    nextCursor
    channel {
      name
      desc
      ptChat
      channelId
    }

    messages {
      id
      msg
      msgId
      edited
      createdAt
      updatedAt
      user {
        id
        nameId
        userId
        iconId
      }
    }

    friend {
      id
      nameId
      userId
      iconId
      status
    }
  }
}
