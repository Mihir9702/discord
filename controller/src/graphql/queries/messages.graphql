query Messages($channelId: String!) {
  messages(channelId: $channelId) {
    channel {
      name
      desc
      ptChat
      channelId
    }

    messages {
      id
      msg
      msgId
      edited
      createdAt
      updatedAt
      user {
        id
        nameId
        userId
        iconId
      }
    }

    friend {
      id
      nameId
      userId
      iconId
      status
    }
  }
}
