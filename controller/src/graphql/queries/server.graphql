query Server($serverId: Float!) {
  server(serverId: $serverId) {
    id
    name
    link
    icon
    serverId
    members {
      role
      user {
        id
        nameId
        userId
        iconId
        status
      }
    }
    channels {
      id
      name
      desc
      channelId
    }
    banned {
      id
      nameId
      userId
      iconId
    }
  }
}
