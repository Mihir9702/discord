query Server($serverId: Float!) {
  server(serverId: $serverId) {
    id
    name
    link
    icon
    serverId
    users {
      id
      nameId
      userId
      iconId
      status
      roles {
        serverId
        role
      }
    }
    channels {
      id
      name
      desc
      channelId
    }
    banned {
      id
      nameId
      userId
      iconId
    }
  }
}
